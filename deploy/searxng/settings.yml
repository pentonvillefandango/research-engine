# SearXNG settings for internal use by the Research Engine.
# Docs: https://docs.searxng.org/admin/settings/index.html
use_default_settings:
  engines:
    keep_only:
      # general web (all measured 2026-10-04 from the deployment VM; see config/intents.yaml)
      - duckduckgo
      - bing
      - yep
      - yahoo
      - mwmbl
      - brave        # rate-limited from a single IP; kept for category searches only
      - qwant        # CAPTCHA from a single IP; kept for category searches only
      - wikipedia
      # technical
      - github
      - stackoverflow
      - mdn
      - microsoft learn
      - docker hub
      - npm
      - crates.io
      # academic
      - arxiv
      - google scholar
      - semantic scholar
      - crossref
      # news
      - bing news
      - duckduckgo news
# Some of these are disabled by default in SearXNG; enable them explicitly.
# (startpage and mojeek are inactive upstream: proof-of-work captcha.)
engines:
  - {name: bing, disabled: false}
  - {name: qwant, disabled: false}
  - {name: npm, disabled: false}
  - {name: crossref, disabled: false}
  - {name: yahoo, disabled: false}
  - {name: yep, disabled: false}
  - {name: mwmbl, disabled: false}
  - {name: microsoft learn, disabled: false}
  - {name: crates.io, disabled: false}
general:
  instance_name: "research-engine-searxng"
server:
  # secret_key comes from SEARXNG_SECRET in the environment
  limiter: false          # internal use only; the limiter would need Valkey
  public_instance: false
  image_proxy: false
  method: "GET"
search:
  formats: [html, json]
  safe_search: 0
  default_lang: "en-GB"
outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
