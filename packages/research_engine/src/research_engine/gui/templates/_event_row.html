<div class="ev ev-{{ e.level.value }}" data-id="{{ e.id if e.id is not none else '' }}"><time datetime="{{ e.ts.isoformat() }}" title="UTC">{{ time }}</time> <span class="lvl">{{ e.level.value }}</span> <span class="kind">{{ e.kind.value }}</span> <span class="msg">{{ e.message }}</span>{% if e.job_id %} <a class="job" href="/jobs/{{ e.job_id|urlencode }}">{{ e.job_id }}</a>{% endif %}{% if e.data %}<details><summary>data</summary><pre>{{ data_json }}</pre></details>{% endif %}</div>
