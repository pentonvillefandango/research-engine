name: research-engine

services:
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  crawl4ai:
    image: unclecode/crawl4ai:0.9.4
    restart: unless-stopped
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN in .env}
      CRAWL4AI_CHROMIUM_SANDBOX: "true"     # Chromium sandbox stays ON (§12, B3, ADR-0022)
    # ADR-0022: Chromium's namespace sandbox needs clone/unshare/setns with namespace flags,
    # which Docker's default seccomp allows only with extra capabilities. The profile is moby's
    # default plus that one rule (deploy/crawl4ai/README.md). The add-on makes Crawl4AI 0.9.4
    # honour CRAWL4AI_CHROMIUM_SANDBOX on every launch path; scripts/check_sandbox.sh verifies.
    security_opt:
      - seccomp=./deploy/crawl4ai/seccomp-chromium.json
      - no-new-privileges:true
    volumes:
      - ./deploy/crawl4ai/sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:11235/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [internal]

networks:
  internal: {}

volumes:
  searxng-cache: {}
